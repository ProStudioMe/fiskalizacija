<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ProRačun</title>
  <meta name="description" content="ProRačun — uskoro.">
  <meta name="theme-color" content="#0b0618">
  <meta property="og:title" content="ProRačun">
  <meta property="og:description" content="Uskoro.">
  <meta property="og:image" content="/img/og-proracun.png">
  <meta property="og:type" content="website">
  <link rel="icon" href="/img/proracun-logo.svg" type="image/svg+xml">
  <style>
    :root {
      --bg0: #070412;
      --bg1: #140a2c;
      --ink: #f4f1fb;
      --muted: rgba(244, 241, 251, 0.62);
      --accent: #7c5cff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 55% at 50% -10%, rgba(124, 92, 255, 0.34), transparent 55%),
        radial-gradient(ellipse 60% 45% at 85% 100%, rgba(46, 196, 167, 0.12), transparent 50%),
        linear-gradient(165deg, var(--bg0), var(--bg1) 55%, #0a0616);
      display: flex;
      flex-direction: column;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.25rem, env(safe-area-inset-bottom));
      overflow: hidden;
    }

    .stage {
      width: min(28rem, 100%);
      margin: auto;
      text-align: center;
      animation: rise 0.9s ease both;
    }

    .logo {
      display: block;
      width: min(15rem, 72vw);
      height: auto;
      margin: 0 auto 1.35rem;
      filter: drop-shadow(0 18px 40px rgba(90, 50, 214, 0.28));
      animation: float 5.5s ease-in-out infinite;
    }

    .soon {
      margin: 0;
      font-size: clamp(1.05rem, 3.4vw, 1.35rem);
      font-weight: 550;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      animation: fade 1.2s ease 0.25s both;
    }

    .byline {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      padding-top: 1rem;
      animation: fade 1.2s ease 0.45s both;
    }

    .byline a {
      display: inline-flex;
      align-items: center;
      opacity: 0.72;
      transition: opacity 0.2s ease;
    }

    .byline a:hover,
    .byline a:focus-visible {
      opacity: 1;
    }

    .byline img {
      display: block;
      height: 18px;
      width: auto;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage, .logo, .soon, .byline { animation: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <img
      class="logo"
      src="/img/proracun-logo.svg"
      width="300"
      height="57"
      alt="ProRačun"
    >
    <p class="soon">Uskoro</p>
  </main>
  <footer class="byline">
    <a href="https://prostudio.me" target="_blank" rel="noopener noreferrer" aria-label="prostudio.me">
      <img src="/img/prostudio-logo.png" width="160" height="25" alt="prostudio.me">
    </a>
  </footer>
</body>
</html>
