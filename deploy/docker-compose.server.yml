# Produkcija na Hetzneru: app iz GHCR + Postgres.
# Kopira se u /home/proracun/docker-compose.yml
# Nginx (Virtualmin) proxy → 127.0.0.1:3040
# Compose interpolacija: docker compose --env-file .docker_env ...

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sepko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sepko
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sepko -d sepko"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks: [proracun]

  app:
    image: ghcr.io/prostudiome/fiskalizacija:latest
    restart: unless-stopped
    env_file:
      - .docker_env
    environment:
      SEPKO_ENV: production
      SEPKO_DATABASE_URL: postgresql+asyncpg://sepko:${POSTGRES_PASSWORD}@db:5432/sepko
      SEPKO_DATABASE_ADMIN_URL: postgresql+psycopg://sepko:${POSTGRES_PASSWORD}@db:5432/sepko
      GUNICORN_WORKERS: "2"
    ports:
      - "127.0.0.1:3040:8000"
    volumes:
      - ./certs:/certs:ro
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks: [proracun]

networks:
  proracun:
    name: proracun-net
    external: true

volumes:
  pgdata:
