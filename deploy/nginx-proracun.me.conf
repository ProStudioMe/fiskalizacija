# Virtualmin vhost — proxy na Docker app (127.0.0.1:3040).
# Kao root: cp na /etc/nginx/sites-enabled/proracun.me.conf && nginx -t && systemctl reload nginx
# Sačuvaj Let's Encrypt .well-known.

server {
    server_name proracun.me www.proracun.me mail.proracun.me webmail.proracun.me admin.proracun.me;
    listen 167.235.33.108;
    listen [2a01:4f8:262:205e::2];
    access_log /var/log/virtualmin/proracun.me_access_log;
    error_log /var/log/virtualmin/proracun.me_error_log;
    client_max_body_size 20m;

    location ^~ /.well-known/ {
        root /home/proracun/public_html;
        try_files $uri =404;
    }

    if ($host = webmail.proracun.me) {
        rewrite "^/(?!\.well-known(?:/|$))(.*)$" "https://proracun.me:20000/$1" redirect;
    }
    if ($host = admin.proracun.me) {
        rewrite "^/(?!\.well-known(?:/|$))(.*)$" "https://proracun.me:10000/$1" redirect;
    }

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
