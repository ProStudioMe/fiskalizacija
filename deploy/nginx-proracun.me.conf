# Virtualmin nginx: sajt na apeksu, aplikacija na moj.proracun.me.
# Ako Virtualmin već ima poseban vhost za moj.proracun.me — isključi ga
# da ne bude dupli server_name.

# --- HTTP: ACME + HTTPS redirect ---

server {
    listen 80;
    server_name moj.proracun.me;

    location /.well-known/acme-challenge/ {
        root /home/proracun/domains/moj.proracun.me/public_html;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name proracun.me www.proracun.me;

    location /.well-known/acme-challenge/ {
        root /home/proracun/public_html;
    }

    return 301 https://$host$request_uri;
}

# --- App: moj.proracun.me → gunicorn 127.0.0.1:3040 ---

server {
    listen 443 ssl http2;
    server_name moj.proracun.me;

    # ssl_certificate /etc/letsencrypt/live/moj.proracun.me/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/moj.proracun.me/privkey.pem;

    access_log /var/log/nginx/access.log combined;
    access_log /var/log/nginx/proracun-access.log custom;
    error_log  /var/log/nginx/proracun-error.log;
    include /etc/nginx/conf.d/cloudflare_ips.conf;

    if ($bad_bot) { return 403; }
    if ($bad_ip) { return 403; }
    if ($bad_uri) { return 403; }
    if ($bad_querystring) { return 403; }

    root /home/proracun/domains/moj.proracun.me/public_html;
    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /home/proracun/domains/moj.proracun.me/public_html;
    }

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    location ~ \.py$ { deny all; }
    location ~ /\. { deny all; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
}

# --- Sajt: proracun.me / www ---
# Stare app rute → moj. Ostalo je statički sajt (public_html).
# Dok sajt nije spreman, umjesto location / stavi:
#   return 301 https://moj.proracun.me$request_uri;

server {
    listen 443 ssl http2;
    server_name proracun.me www.proracun.me;

    # ssl_certificate /etc/letsencrypt/live/proracun.me/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/proracun.me/privkey.pem;

    access_log /var/log/nginx/access.log combined;
    access_log /var/log/nginx/proracun-site-access.log custom;
    error_log  /var/log/nginx/proracun-error.log;
    include /etc/nginx/conf.d/cloudflare_ips.conf;

    if ($bad_bot) { return 403; }
    if ($bad_ip) { return 403; }
    if ($bad_uri) { return 403; }
    if ($bad_querystring) { return 403; }

    root /home/proracun/public_html;
    index index.html;
    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /home/proracun/public_html;
    }

    location ~ ^/(login|logout|app|admin|racuni|kasa|artikli|kupci|blagajna|podesavanja|ulazne|troskovi|izvjestaji|finansije|v1|cron|manifest|sw\.js|static)(/|$) {
        return 301 https://moj.proracun.me$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.py$ { deny all; }
    location ~ /\. { deny all; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
}
