services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sepko
      POSTGRES_PASSWORD: sepko
      POSTGRES_DB: sepko
    ports:
      - "5433:5432"
    volumes:
      - sepko_pg:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sepko -d sepko"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  sepko_pg:
