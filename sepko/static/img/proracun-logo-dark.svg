<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 57" fill="none" role="img" aria-label="proračun">
  <defs>
    <clipPath id="pcd"><rect x="2" y="4" width="49" height="49" rx="13"/></clipPath>
  </defs>

  <!-- single rounded square, medium purple -->
  <g clip-path="url(#pcd)">
    <rect x="2" y="4" width="49" height="49" fill="#7C3AED"/>
  </g>

  <!-- thick black checkmark cutting diagonally from bottom-left -->
  <path d="M10 33 L22 44 L44 16" stroke="#0B0618" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- wordmark: proračun (lowercase, light lavender for dark backgrounds) -->
  <text x="62" y="40" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif"
        font-size="28" font-weight="800" letter-spacing="-0.4" fill="#C4B5FD">proračun</text>
</svg>
