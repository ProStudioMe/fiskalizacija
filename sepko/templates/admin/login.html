{% extends "base.html" %}
{% block title %}Prijava — {{ brand }} admin{% endblock %}
{% block auth %}
<div class="login-wrap">
  <div class="card login-card">
    <div class="brand">
      <img class="brand-logo brand-logo-lg" src="/static/img/sepko-logo-dark.svg?v=10" alt="{{ brand }}" width="248" height="48">
    </div>
    <p class="muted">Prijava u platformu</p>
    {% if flash %}
      <div class="flash {% if flash_type == 'error' %}error{% endif %}" role="status">{{ flash }}</div>
    {% endif %}
    <form method="post" action="/admin/login" class="wa-form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <wa-input id="email" name="email" type="email" label="Email" required autocomplete="username"></wa-input>
      <wa-input id="password" name="password" type="password" password-toggle label="Lozinka" required autocomplete="current-password"></wa-input>
      <div class="wa-form-actions">
        <wa-button type="submit" variant="brand">Prijavi se</wa-button>
      </div>
    </form>
    <p class="muted" style="margin-top:1rem"><a href="/login">Prijava firme</a></p>
  </div>
</div>
{% endblock %}
