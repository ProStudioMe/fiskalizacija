<label class="per-page">
  {{ t('label.per_page', 'Po stranici') }}
  <select name="per_page" class="per-page-native" aria-label="{{ t('label.per_page', 'Po stranici') }}">
    {% for n in page_sizes %}
    <option value="{{ n }}" {% if per_page == n %}selected{% endif %}>{{ n }}</option>
    {% endfor %}
  </select>
</label>
<script>
(function () {
  document.querySelectorAll('select.per-page-native').forEach(function (sel) {
    if (sel.dataset.bound) return;
    sel.dataset.bound = '1';
    sel.addEventListener('change', function () {
      var form = sel.closest('form');
      if (form) form.submit();
    });
  });
})();
</script>
