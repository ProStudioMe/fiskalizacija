<label class="per-page">
  {{ t('label.per_page', 'Prikaži') }}
  <wa-select name="per_page" value="{{ per_page }}" size="small" class="per-page-select">
    {% for n in page_sizes %}
    <wa-option value="{{ n }}" {% if per_page == n %}selected{% endif %}>{{ n }}</wa-option>
    {% endfor %}
  </wa-select>
</label>
<script>
(function () {
  document.querySelectorAll('wa-select.per-page-select').forEach(function (sel) {
    if (sel.dataset.bound) return;
    sel.dataset.bound = '1';
    function go() {
      var form = sel.closest('form');
      if (form) form.submit();
    }
    sel.addEventListener('change', go);
    sel.addEventListener('wa-change', go);
  });
})();
</script>
