{% extends "base.html" %}
{% block title %}{{ t('login.title', 'Prijava') }} — {{ brand }}{% endblock %}
{% block auth %}
<div class="login-wrap">
  <div class="card login-card">
    <div class="brand">
      <img class="brand-logo brand-logo-lg" src="/static/img/sepko-logo-dark.svg?v=9" alt="{{ brand }}" width="248" height="48">
    </div>
    <p class="muted">{{ t('login.title', 'Prijava') }}</p>
    {% if flash %}
      <div class="flash {% if flash_type == 'error' %}error{% endif %}" role="status">{{ flash }}</div>
    {% endif %}
    <form method="post" action="/login" class="wa-form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <wa-input id="email" name="email" type="email" label="{{ t('login.email', 'Email') }}" required autocomplete="username"></wa-input>
      <wa-input id="password" name="password" type="password" password-toggle label="{{ t('login.password', 'Lozinka') }}" required autocomplete="current-password"></wa-input>
      <div class="wa-form-actions">
        <wa-button type="submit" variant="brand">{{ t('login.submit', 'Prijavi se') }}</wa-button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
